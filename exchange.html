<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exchange naira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="container">
    <section class="page-hero bg-bitcoin">
      <span class="kicker">Exchange</span>
      <h1>Change naira to RMB and crypto.</h1>
      <p>Clear buy and sell rates, no hidden fees. Your money lands in your wallet straight away.</p>
    </section>
    <div class="two-col">
      <div class="stack">
        <section class="card" id="fx-root" aria-label="Exchange calculator"></section>
        <section class="card" aria-labelledby="rates-h">
          <div class="section-head"><h2 id="rates-h">All rates</h2></div>
          <div class="table-wrap" id="rates-table"></div>
          <p class="muted small mt-12">Demo rates set by the store admin. They are not live market prices.</p>
        </section>
      </div>
      <aside class="card" id="fx-side"></aside>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/exchange.js"></script>
</body>
</html>
