<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All products</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main" class="container">
    <h1 class="page-title" id="list-title">All products</h1>
    <div class="listing">
      <aside class="card filters" aria-label="Filters">
        <div class="label" id="filter-cats-label">Category</div>
        <div class="filter-cats" id="filter-cats"></div>
        <div class="label mt-12" id="filter-subs-label" hidden></div>
        <div class="filter-cats" id="filter-subs" hidden></div>
        <div class="label mt-12">Condition</div>
        <div class="chips" id="filter-condition"></div>
        <div class="label mt-12" id="filter-custom-label" hidden>For my brand</div>
        <div class="chips" id="filter-custom" hidden></div>
        <div class="field mt-12">
          <span>Sort by</span>
          <div class="sort-control" id="sort-control">
            <button class="sort-trigger" id="sort-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="sort-options">
              <span id="sort-value">Most popular</span><span class="sort-chevron" aria-hidden="true"></span>
            </button>
            <div class="sort-options" id="sort-options" role="listbox" aria-label="Sort products" hidden></div>
          </div>
        </div>
        <label class="field">
          <span>Maximum price (₦)</span>
          <input id="max-price" type="number" min="0" step="1000" inputmode="numeric" placeholder="Any price">
        </label>
      </aside>
      <div>
        <p class="muted small" id="result-count" aria-live="polite"></p>
        <div class="grid-products mt-12" id="results"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/products.js"></script>
</body>
</html>
